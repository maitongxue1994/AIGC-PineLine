name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['claude/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: 首页结构/文案校验
        run: npm run test:tapnow
      - name: npm audit (high)
        run: npm audit --audit-level=high
        continue-on-error: true
